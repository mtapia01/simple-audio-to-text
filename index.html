<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Transcriber</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <h1>Lecture Transcriber</h1>
    <p>Turn lecture recordings into text. Everything runs in your browser, so your audio never leaves your computer.</p>
  </header>

  <section class="card">
    <label class="drop" id="dropZone">
      <input type="file" id="file" accept="audio/*,video/*" multiple hidden>
      <strong id="dropMsg">Choose audio files or drop them here</strong>
      <span>mp3, m4a, wav, ogg, webm</span>
    </label>
    <div id="files"></div>
    <div class="row">
      <label>Model
        <select id="model">
          <option value="Xenova/whisper-tiny.en">Tiny, English: fastest (40 MB)</option>
          <option value="Xenova/whisper-base.en" selected>Base, English: balanced (75 MB)</option>
          <option value="Xenova/whisper-small.en">Small, English: most accurate (250 MB)</option>
          <option value="Xenova/whisper-base">Base, any language (75 MB)</option>
        </select>
      </label>
      <button id="go" disabled>Transcribe</button>
      <button id="stop" hidden>Cancel</button>
    </div>
    <div class="bar" id="prog" hidden><i id="fill"></i></div>
    <p id="status" role="status"></p>
  </section>

  <section class="card" id="player" hidden>
    <div id="now"></div>
    <audio id="audio" controls></audio>
    <div id="caption"><div id="capText"></div></div>
  </section>

  <section class="card" id="out" hidden>
    <div class="toolbar">
      <h2 id="outTitle">Transcript</h2>
      <label class="chk"><input type="checkbox" id="ts"> Timestamps in .txt</label>
      <label class="chk"><input type="checkbox" id="fileHeadings"> Remove file headings in .txt</label>
      <button id="copy">Copy</button>
      <button id="txt" title="All files in one text file">Save .txt</button>
      <button id="srt" title="Subtitles for the file in the player">Save .srt</button>
    </div>
    <div id="list"></div>
    <button id="backToTopBtn" title="Go to top">▲</button>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
